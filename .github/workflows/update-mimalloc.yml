name: Update mimalloc

on:
  schedule:
    - cron: "36 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-mimalloc
  cancel-in-progress: false

env:
  SUBMODULE: cyo-mimalloc-sys/c_src/mimalloc

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Find latest v3 release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api 'repos/microsoft/mimalloc/releases?per_page=100' \
            --jq '.[] | select(.draft | not) | select(.prerelease | not) | .tag_name' \
            | grep -E '^v3\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          if [ -z "$tag" ]; then
            echo "no v3 release found" >&2
            exit 1
          fi
          git -C "$SUBMODULE" fetch --depth 1 origin "refs/tags/$tag:refs/tags/$tag"
          new=$(git -C "$SUBMODULE" rev-parse "$tag^{commit}")
          old=$(git -C "$SUBMODULE" rev-parse HEAD)
          old_version=$(awk '/^#define MI_MALLOC_VERSION/ { print $3 }' "$SUBMODULE/include/mimalloc.h")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "old_version=$old_version" >> "$GITHUB_OUTPUT"
          if [ "$new" = "$old" ]; then
            echo "Already at $tag"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Updating $old -> $new ($tag)"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Move submodule to release
        if: steps.latest.outputs.changed == 'true'
        run: |
          old=$(git -C "$SUBMODULE" rev-parse HEAD)
          git -C "$SUBMODULE" checkout --detach "${{ steps.latest.outputs.tag }}"
          git -C "$SUBMODULE" diff "$old" HEAD -- ':(glob)include/*.h' > "$RUNNER_TEMP/headers.diff"

      - uses: dtolnay/rust-toolchain@stable
        if: steps.latest.outputs.changed == 'true'

      - name: Test
        id: test
        if: steps.latest.outputs.changed == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          {
            cargo test --workspace
            MI_SECURE=4 MI_DEBUG=2 cargo test --workspace
          } 2>&1 | tee "$RUNNER_TEMP/test.log"

      - name: Write PR body
        if: steps.latest.outputs.changed == 'true'
        env:
          TAG: ${{ steps.latest.outputs.tag }}
          OLD_VERSION: ${{ steps.latest.outputs.old_version }}
          TEST_OUTCOME: ${{ steps.test.outcome }}
        run: |
          body="$RUNNER_TEMP/body.md"
          {
            echo "Updates the vendored mimalloc from \`$OLD_VERSION\` to [$TAG](https://github.com/microsoft/mimalloc/releases/tag/$TAG)."
            echo
            if [ "$TEST_OUTCOME" = "success" ]; then
              echo "\`cargo test\` passed."
            else
              echo "**\`cargo test\` failed.** Tail of the log:"
              echo
              echo '```'
              tail -n 80 "$RUNNER_TEMP/test.log"
              echo '```'
            fi
            echo
            if [ -s "$RUNNER_TEMP/headers.diff" ]; then
              echo "Changes to the public headers (check the bindings in \`cyo-mimalloc-sys/src/lib.rs\`):"
              echo
              echo '```diff'
              head -c 50000 "$RUNNER_TEMP/headers.diff"
              echo '```'
            else
              echo "The public headers are unchanged."
            fi
          } > "$body"

      - uses: peter-evans/create-pull-request@v8
        if: steps.latest.outputs.changed == 'true'
        with:
          branch: update-mimalloc
          delete-branch: true
          add-paths: ${{ env.SUBMODULE }}
          commit-message: "Update mimalloc to ${{ steps.latest.outputs.tag }}"
          title: "Update mimalloc to ${{ steps.latest.outputs.tag }}"
          body-path: ${{ runner.temp }}/body.md
