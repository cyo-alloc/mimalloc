[package]
name = "rustfs-mimalloc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "High-performance mimalloc V3 global allocator for Rust"
keywords.workspace = true
categories.workspace = true

[features]
default = []
# Security: heap allocation encryption
secure = ["rustfs-mimalloc-sys/secure"]
secure_level_1 = ["rustfs-mimalloc-sys/secure_level_1"]
secure_level_2 = ["rustfs-mimalloc-sys/secure_level_2"]
secure_level_3 = ["rustfs-mimalloc-sys/secure_level_3"]
secure_level_4 = ["rustfs-mimalloc-sys/secure_level_4"]
secure_level_5 = ["rustfs-mimalloc-sys/secure_level_5"]
# Debug mode
debug = ["rustfs-mimalloc-sys/debug"]
debug_in_debug = ["rustfs-mimalloc-sys/debug_in_debug"]
# Override system malloc
override = ["rustfs-mimalloc-sys/override"]
# TLS model option
local_dynamic_tls = ["rustfs-mimalloc-sys/local_dynamic_tls"]
# Disable THP
no_thp = ["rustfs-mimalloc-sys/no_thp"]
# Backward-compatible no-op: stats, options, version, heap/arena APIs are always available.
extended = ["rustfs-mimalloc-sys/extended"]
# Nightly Allocator trait support
nightly_allocator_api = []

[dependencies]
rustfs-mimalloc-sys = { workspace = true }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "alloc"
harness = false
